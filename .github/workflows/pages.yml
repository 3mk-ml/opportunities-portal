name: Deploy Opportunities Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate opportunity data
        run: |
          node scripts/validate-data.js
          node scripts/validate-data.js --test
          node scripts/validate-data.js --release
          node scripts/test-integration.js
          node scripts/check-html.js

      - name: Prepare static site artifact
        run: |
          mkdir -p _site/data
          cp index.html detail.html about.html sw.js .nojekyll _site/
          cp -R css js assets _site/
          cp data/opportunities.json _site/data/opportunities.json
          test -s _site/index.html
          test -s _site/data/opportunities.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4