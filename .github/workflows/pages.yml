name: Deploy Opportunities Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout complete project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate data, source syntax, integration, and font references
        run: |
          node scripts/validate-data.js
          node scripts/validate-data.js --test
          node scripts/validate-data.js --release
          node scripts/test-integration.js
          node scripts/check-html.js
          for file in js/*.js scripts/*.js sw.js; do node --check "$file"; done

      - name: Prepare static site with original typography
        run: |
          mkdir -p _site/data
          cp index.html detail.html about.html sw.js .nojekyll _site/
          cp -R css js assets _site/
          cp data/opportunities.json _site/data/opportunities.json
          test -s _site/index.html
          test -s _site/data/opportunities.json
          grep -q 'IBM+Plex+Sans+Arabic' _site/index.html
          grep -q 'IBM+Plex+Sans+Arabic' _site/detail.html
          grep -q 'IBM+Plex+Sans+Arabic' _site/about.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # One-time setup: Settings > Pages > Source > GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
